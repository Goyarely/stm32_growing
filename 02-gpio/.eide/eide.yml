version: "4.1"
name: 02-gpio
type: ARM
deviceName: STM32F103C8
packDir: .pack/Keil/STM32F1xx_DFP.2.3.0
srcDirs: []
virtualFolder:
  name: <virtual_root>
  files: []
  folders:
    - name: App
      files:
        - path: App/main.c
      folders: []
    - name: Driver
      files:
        - path: Driver/stm32f1xx_it.c
        - path: Driver/led.c
        - path: Driver/led.h
        - path: Driver/key.c
        - path: Driver/key.h
      folders: []
    - name: Arm
      files:
        - path: Arm/system_stm32f1xx.c
        - path: Arm/startup_stm32f103xb.s
      folders: []
    - name: STM32_Hal
      files:
        - path: STM32_Hal/Src/stm32f1xx_hal.c
        - path: STM32_Hal/Src/stm32f1xx_hal_cortex.c
        - path: STM32_Hal/Src/stm32f1xx_hal_gpio.c
        - path: STM32_Hal/Src/stm32f1xx_hal_rcc.c
      folders: []
dependenceList: []
outDir: build
miscInfo:
  uid: b7e4a1c93d2f8056e1a4b7c9d0e3f258
targets:
  02-gpio:
    cppPreprocessAttrs:
      defineList:
        - STM32F103xB
        - USE_HAL_DRIVER
      incList:
        - .
        - App
        - Arm
        - Driver
        - STM32_Hal
        - STM32_Hal/Inc
        - .cmsis/include
        - RTE/_ARM32
      libList: []
    excludeList: []
    settings:
      debugger: cortex-debug
    toolchain: AC5
    toolchainConfigMap:
      AC5:
        archExtensions: ""
        cpuType: Cortex-M3
        floatingPointHardware: none
        options:
          version: 4
          afterBuildTasks: []
          asm-compiler:
            defines: []
          beforeBuildTasks: []
          c/cpp-compiler:
            CXX_FLAGS: --diag_suppress=1 --diag_suppress=1295
            C_FLAGS: --diag_suppress=1 --diag_suppress=1295
            c99-mode: true
            one-elf-section-per-function: true
            optimization: level-0
            warnings: all-warnings
          global:
            output-debug-info: enable
            use-microLIB: true
          linker:
            $disableOutputTask: false
            $outputTaskExcludes:
              - .bin
              - .s19
            output-format: elf
            ro-base: "0x08000000"
            rw-base: "0x20000000"
            xo-base: ""
        scatterFilePath: ""
        storageLayout:
          RAM:
            - id: 1
              isChecked: false
              mem:
                size: "0x0"
                startAddr: "0x0"
              noInit: false
              tag: RAM
            - id: 2
              isChecked: false
              mem:
                size: "0x0"
                startAddr: "0x0"
              noInit: false
              tag: RAM
            - id: 3
              isChecked: false
              mem:
                size: "0x0"
                startAddr: "0x0"
              noInit: false
              tag: RAM
            - id: 1
              isChecked: true
              mem:
                size: "0x2800"
                startAddr: "0x20000000"
              noInit: false
              tag: IRAM
            - id: 2
              isChecked: false
              mem:
                size: "0x0"
                startAddr: "0x0"
              noInit: false
              tag: IRAM
          ROM:
            - id: 1
              isChecked: false
              isStartup: false
              mem:
                size: "0x0"
                startAddr: "0x0"
              tag: ROM
            - id: 2
              isChecked: false
              isStartup: false
              mem:
                size: "0x0"
                startAddr: "0x0"
              tag: ROM
            - id: 3
              isChecked: false
              isStartup: false
              mem:
                size: "0x0"
                startAddr: "0x0"
              tag: ROM
            - id: 1
              isChecked: true
              isStartup: true
              mem:
                size: "0x10000"
                startAddr: "0x8000000"
              tag: IROM
            - id: 2
              isChecked: false
              isStartup: false
              mem:
                size: "0x0"
                startAddr: "0x0"
              tag: IROM
        useCustomScatterFile: false
    uploadConfigMap:
      JLink:
        baseAddr: ""
        bin: ""
        cpuInfo:
          cpuName: STM32F103C8
          vendor: ST
        otherCmds: ""
        proType: 1
        speed: 8000
    uploader: JLink
